; =============================================================================
; Fail Konfigurasi Odoo - Dijana oleh BastilleBSD Template
; Versi Odoo : ${ODOO_BRANCH}
; =============================================================================
; Dokumentasi: https://www.odoo.com/documentation/${ODOO_VERSION}.0/administration/on_premise/deploy.html

[options]

; ---------------------------------------------------------------------------
; Laluan & Direktori
; ---------------------------------------------------------------------------
; Direktori data Odoo (sessions, attachments, dll)
data_dir = ${ODOO_HOME}/data

; Laluan tambahan modul (pisahkan dengan koma)
addons_path =
    ${ODOO_HOME}/src/addons,
    ${ODOO_HOME}/src/odoo/addons,
    ${ODOO_HOME}/addons/custom

; Fail log
logfile = /var/log/odoo/odoo-${ODOO_BRANCH}.log

; Paras log: debug_rpc_answer, debug_rpc, debug, info, warn, error, critical
log_level = ${LOG_LEVEL}

; Penapis log (format: logger:level,logger:level)
; Contoh: log_handler = werkzeug:WARNING,odoo.http:DEBUG
log_handler = :${LOG_LEVEL}

; PID file
pidfile = /var/run/odoo/odoo.pid

; ---------------------------------------------------------------------------
; Rangkaian & Antara Muka
; ---------------------------------------------------------------------------
; Antara muka untuk server HTTP
; Kosongkan ('') untuk dengar semua antara muka
; xmlrpc_interface =

; Port utama Odoo
http_port = ${ODOO_PORT}
xmlrpc_port = ${ODOO_PORT}

; Port longpolling (untuk live chat, notifikasi)
longpolling_port = ${ODOO_LONGPOLL_PORT}

; Aktifkan proxy mode (jika di belakang nginx/haproxy)
; proxy_mode = True

; ---------------------------------------------------------------------------
; Pangkalan Data (PostgreSQL)
; ---------------------------------------------------------------------------
db_host = ${DB_HOST}
db_port = ${DB_PORT}
db_user = ${DB_USER}
db_password = ${DB_PASSWORD}

; Nama DB lalai (kosongkan untuk pilih semasa login)
; db_name = False

; Penapis DB (regex untuk senarai DB yang dibenarkan)
; dbfilter = ^mycompany.*$

; Jumlah maksimum sambungan DB
db_maxconn = 64

; ---------------------------------------------------------------------------
; Prestasi & Pekerja
; ---------------------------------------------------------------------------
; Bilangan pekerja gevent (0 = single-threaded, >0 = multi-process)
; Untuk production: workers = (CPU * 2) + 1
workers = ${WORKERS}

; Thread pekerja cron
max_cron_threads = ${MAX_CRON_THREADS}

; Had masa CPU per permintaan (saat)
limit_time_cpu = ${LIMIT_TIME_CPU}

; Had masa sebenar per permintaan (saat)
limit_time_real = ${LIMIT_TIME_REAL}

; Had masa untuk cron (lebih tinggi dari permintaan biasa)
limit_time_real_cron = ${LIMIT_TIME_REAL}

; Had memori (bytes)
; 2GB hard, 1.5GB soft (lalai)
limit_memory_hard = ${LIMIT_MEMORY_HARD}
limit_memory_soft = ${LIMIT_MEMORY_SOFT}

; Had permintaan per pekerja
; limit_request = 8192

; ---------------------------------------------------------------------------
; Keselamatan
; ---------------------------------------------------------------------------
; Kata laluan admin untuk pengurusan pangkalan data
admin_passwd = ${ADMIN_PASSWD}

; Matikan pemilihan DB di skrin login (production)
; list_db = False

; Matikan endpoint /web/database/manager
; dbmanager_password = False

; ---------------------------------------------------------------------------
; E-mel & SMTP (optional - konfigurasikan dalam antara muka Odoo)
; ---------------------------------------------------------------------------
; email_from = odoo@yourdomain.com
; smtp_server = localhost
; smtp_port = 25
; smtp_ssl = False
; smtp_user =
; smtp_password =

; ---------------------------------------------------------------------------
; Bahasa & Tempat
; ---------------------------------------------------------------------------
; Bahasa lalai untuk pengguna baru
; lang = ms_MY

; ---------------------------------------------------------------------------
; Ciri Khas Versi ${ODOO_BRANCH}
; ---------------------------------------------------------------------------
; [Odoo 16+] Aktifkan mode komuniti atau enterprise
; server_wide_modules = base,web

; [Odoo 17+] Redis untuk sesi (optional)
; session_store_path = redis://localhost:6379/0

; [Odoo 18+] Konfigurasi tambahan
; gevent_port = ${ODOO_LONGPOLL_PORT}

; ---------------------------------------------------------------------------
; Pembangunan (aktifkan HANYA di persekitaran dev)
; ---------------------------------------------------------------------------
; dev = all
; reload_on_migration = True
; test_enable = False

; ---------------------------------------------------------------------------
; Screenshot & Laporan (wkhtmltopdf)
; ---------------------------------------------------------------------------
; Tentukan laluan wkhtmltopdf jika tidak dalam PATH
; wkhtmltopdf_path = /usr/local/bin/wkhtmltopdf
